name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # server/lib/prisma.ts types come from the generated client, which is not in
      # the repo, so typecheck and build both need this to have run first.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Nuxt's generated tsconfigs only include test/nuxt/**, so the unit tests
      # need their own project or type errors in them never fail the build.
      - name: Type check tests
        run: npm run typecheck:test

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Nothing queries the database at build time; Prisma only needs the var to exist.
          DATABASE_URL: postgresql://ci:notused@localhost:5432/kalima
